<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツールくんダッシュ - 高いアヤツ追加版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f3f6;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .desc {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 400px;
            background: #BCE3FF;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: background 1.5s ease;
        }
        #gameCanvas {
            display: block;
            background: transparent;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 10;
        }
        .overlay h2 {
            font-size: 40px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .overlay p {
            font-size: 18px;
            margin: 0 0 20px 0;
        }
        .btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e65100;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #e65100;
        }
    </style>
</head>
<body>

    <h1>⚡ ツールくんダッシュ ⚡</h1>
    <div class="desc">空飛ぶ「高いアヤツ」が新登場！下をくぐるか、上を飛ぶか瞬時に判断しろ！</div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <!-- スタート画面 -->
        <div id="startScreen" class="overlay">
            <h2>ツールくんダッシュ</h2>
            <p>ハイスコアを目指して走り抜けろ！</p>
            <button class="btn" onclick="startGame(); event.stopPropagation();">ゲームスタート</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameOverScreen" class="overlay" style="display: none;">
            <h2>GAME OVER</h2>
            <p id="finalScoreText">スコア: 0 点</p>
            <p style="font-size: 14px; animation: blink 1s infinite;">画面をタップ・クリックでもう一度プレイ</p>
            <button class="btn" onclick="startGame(); event.stopPropagation();">もう一度プレイ</button>
        </div>
    </div>
    <script>
        const style = document.createElement('style');
        style.innerHTML = '@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }';
        document.head.appendChild(style);
    </script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScoreText');

        // ゲームシステム用変数
        let gameState = 'START'; 
        let score = 0;
        let highScore = localStorage.getItem('toolkun_dash_best') ? parseInt(localStorage.getItem('toolkun_dash_best')) : 0;
        
        let baseSpeed = 4.0; 
        let gameSpeed = baseSpeed; 
        let distance = 0;
        let currentStage = 1;
        let animFrame = 0; 
        let obstacleSpawnCooldown = 0; 

        // 地面の設定
        const groundHeight = 60;
        const groundY = canvas.height - groundHeight;

        // ツールくん（キャラクター）の設定
        const player = {
            x: 120,
            y: 300,
            width: 26,   
            height: 38,  
            gravity: 0.45,
            velocity: 0,
            jumpPower: -10.0,
            jumpCount: 0,
            maxJumps: 2,
            color: '#FF6B6B'
        };

        let obstacles = [];
        let coins = [];
        let particles = [];
        let scoreTexts = [];       
        let levelUpTexts = [];     

        // 背景の雲
        let clouds = [
            { x: 150, y: 60, size: 35, speed: 0.3 },
            { x: 450, y: 90, size: 50, speed: 0.15 },
            { x: 750, y: 50, size: 30, speed: 0.4 }
        ];

        // 各種操作イベント
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleAction();
            }
        });
        
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#gameContainer') || e.target === canvas) {
                handleAction();
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#gameContainer') || e.target === canvas) {
                e.preventDefault();
                handleAction();
            }
        }, { passive: false });

        function handleAction() {
            if (gameState === 'PLAYING') {
                if (player.jumpCount < player.maxJumps) {
                    player.velocity = player.jumpPower;
                    player.jumpCount++;
                    createParticles(player.x + player.width/2, player.y + player.height, '#FFF', 6);
                }
            } else if (gameState === 'GAMEOVER' || gameState === 'START') {
                startGame();
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            gameSpeed = baseSpeed; 
            distance = 0;
            currentStage = 1;
            animFrame = 0;
            obstacleSpawnCooldown = 0;
            obstacles = [];
            coins = [];
            particles = [];
            scoreTexts = [];
            levelUpTexts = [];
            
            player.y = groundY - player.height;
            player.velocity = 0;
            player.jumpCount = 0;

            gameContainer.style.background = '#BCE3FF'; 
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    size: Math.random() * 4 + 2,
                    alpha: 1, color: color
                });
            }
        }
        function updateBgColor(lv) {
            if (lv >= 50) return '#4A0E4E'; 
            if (lv < 10) {
                let r = Math.floor(188 + (lv * 7.4));
                let g = Math.floor(227 - (lv * 5.4));
                let b = Math.floor(255 - (lv * 16));
                return `rgb(${r}, ${g}, ${b})`;
            } else if (lv < 25) {
                let pct = (lv - 10) / 15;
                let r = Math.floor(254 - (pct * 225));
                let g = Math.floor(173 - (pct * 131));
                let b = Math.floor(111 - (pct * 43));
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                let pct = (lv - 25) / 25;
                let r = Math.floor(29 - (pct * 20));
                let g = Math.floor(42 - (pct * 35));
                let b = Math.floor(68 - (pct * 40));
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawClouds();

            ctx.fillStyle = '#00CD66'; 
            ctx.fillRect(0, groundY, canvas.width, 12);
            ctx.fillStyle = '#009E49'; 
            ctx.fillRect(0, groundY + 12, canvas.width, groundHeight - 12);

            if (gameState === 'PLAYING') {
                distance++;
                animFrame++; 
                if (distance % 2 === 0) score += 1;

                if (score > highScore) {
                    highScore = score;
                }

                let targetStage = Math.floor(score / 500) + 1;
                if (targetStage > 50) targetStage = 50; 

                if (targetStage !== currentStage) {
                    currentStage = targetStage;
                    gameSpeed = baseSpeed + Math.log(currentStage) * 1.5;
                    gameContainer.style.background = updateBgColor(currentStage);

                    levelUpTexts.push({
                        text: `＋レベル${currentStage}`,
                        x: canvas.width / 2, y: canvas.height / 2 - 20,
                        alpha: 1.0, scale: 0.5, timer: 60
                    });
                    createParticles(canvas.width / 2, canvas.height / 2 - 20, '#FFD700', 25);
                    createParticles(canvas.width / 2, canvas.height / 2 - 20, '#00FFFF', 15);
                }

                player.velocity += player.gravity;
                player.y += player.velocity;

                if (player.y >= groundY - player.height) {
                    player.y = groundY - player.height;
                    player.velocity = 0;
                    player.jumpCount = 0;
                }

                if (obstacleSpawnCooldown > 0) {
                    obstacleSpawnCooldown--;
                }

                let baseSpawnInterval = Math.max(50, 130 - (currentStage * 1.8));

                // 障害物のランダム生成
                if (obstacleSpawnCooldown === 0 && distance % Math.floor(baseSpawnInterval) === 0) {
                    let randType = Math.random();
                    let count = Math.random() > 0.65 ? 2 : 1; 
                    
                    for (let c = 0; c < count; c++) {
                        let w = 55;
                        let h = 55; 
                        let targetY = groundY - h; // 基本は地上設置
                        let t = 'normal';
                        
                        if (randType < 0.25) {
                            // 1. 低いトゲ
                            w = 40; h = 25; t = 'low';
                            targetY = groundY - h;
                        } else if (randType > 0.50 && randType < 0.72) {
                            // 🌟 2. 【新登場】高いアヤツ（空中に浮いていて下をくぐれる障害物）
                            w = 45; h = 40; t = 'floating';
                            // キャラクターのジャンプが届く、かつ地上を走ればくぐれる絶妙な高さ(地上から75px〜95px浮かす)
                            targetY = groundY - 125; 
                        } else if (randType >= 0.82 && currentStage >= 3) {
                            // 3. 高い大壁
                            w = 55; h = 80; t = 'high';
                            targetY = groundY - h;
                        }

                        obstacles.push({
                            x: canvas.width + (c * (w + 15)), 
                            y: targetY, 
                            width: w, 
                            height: h,
                            type: t
                        });
                    }

                    obstacleSpawnCooldown = Math.floor(baseSpawnInterval * 0.75) + (count * 20);
                }

                if (distance % 80 === 0 && Math.random() > 0.3) {
                    let coinY = groundY - (Math.random() * 140 + 50);
                    coins.push({ x: canvas.width, y: coinY, width: 20, height: 20, active: true });
                }
            }
            // 障害物の移動と種類ごとの描画処理
            for (let i = obstacles.length - 1; i >= 0; i--) {
                if (gameState === 'PLAYING') obstacles[i].x -= gameSpeed;

                let obs = obstacles[i];

                if (obs.type === 'low') {
                    // 低い障害物：ピンクレッドのトゲ
                    ctx.fillStyle = '#E91E63';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, groundY);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, groundY);
                    ctx.fill();
                } else if (obs.type === 'high') {
                    // 高い障害物：濃いグレーの巨大壁
                    ctx.fillStyle = '#555555';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#333'; ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x + 3, obs.y + 3, obs.width - 6, obs.height - 6);
                    ctx.fillStyle = '#FFEB3B';
                    ctx.fillRect(obs.x + 8, obs.y + 15, obs.width - 16, 12);
                    ctx.fillRect(obs.x + 8, obs.y + 50, obs.width - 16, 12);
                } else if (obs.type === 'floating') {
                    // 🌟 高いアヤツ（飛行メカ/吊り下げトラップ風デザイン）
                    ctx.save();
                    // 本体（紫色の怪しい飛行ブロック）
                    ctx.fillStyle = '#9C27B0';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#4A148C'; ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x + 2, obs.y + 2, obs.width - 4, obs.height - 4);
                    // 下に向けられた危険な赤いセンサーライト
                    ctx.fillStyle = '#FF1744';
                    ctx.fillRect(obs.x + 6, obs.y + obs.height - 6, obs.width - 12, 6);
                    // 飛行用の小さな羽/ウイング
                    ctx.fillStyle = '#7B1FA2';
                    ctx.fillRect(obs.x - 6, obs.y + 10, 6, 8);
                    ctx.fillRect(obs.x + obs.width, obs.y + 10, 6, 8);
                    ctx.restore();
                } else {
                    // 通常の茶色い立方体ブロック
                    ctx.fillStyle = '#C66C28';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                    ctx.strokeRect(obs.x + 4, obs.y + 4, obs.width - 8, obs.height - 8);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath(); ctx.arc(obs.x + obs.width/2, obs.y + obs.height/2, 10, 0, Math.PI*2); ctx.fill();
                }

                if (gameState === 'PLAYING' && checkCollision(player, obs)) {
                    gameState = 'GAMEOVER';
                    createParticles(player.x + player.width/2, player.y + player.height/2, '#FF6B6B', 30);
                    
                    let storedBest = localStorage.getItem('toolkun_dash_best') ? parseInt(localStorage.getItem('toolkun_dash_best')) : 0;
                    if (score > storedBest) {
                        localStorage.setItem('toolkun_dash_best', score);
                    }

                    finalScoreText.innerText = `スコア: ${score} 点`;
                    gameOverScreen.style.display = 'flex';
                }

                if (obs.x + obs.width < -200) obstacles.splice(i, 1);
            }

            // コインの処理
            for (let i = coins.length - 1; i >= 0; i--) {
                if (gameState === 'PLAYING') coins[i].x -= gameSpeed;

                if (coins[i].active) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(coins[i].x + 10, coins[i].y + 10, 10, 0, Math.PI * 2); ctx.fill();

                    if (gameState === 'PLAYING' && checkCollision(player, coins[i])) {
                        coins[i].active = false;
                        score += 50; 
                        scoreTexts.push({ x: coins[i].x - 10, y: coins[i].y - 5, alpha: 1.0, timer: 45 });
                        createParticles(coins[i].x + 10, coins[i].y + 10, '#FFD700', 10);
                    }
                }
                if (coins[i].x + 20 < 0) coins.splice(i, 1);
            }

            // コインテキスト描画 (＋５０)
            ctx.save();
            ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
            for (let i = scoreTexts.length - 1; i >= 0; i--) {
                let t = scoreTexts[i]; ctx.globalAlpha = t.alpha;
                ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3; ctx.strokeText("＋５０", t.x, t.y);
                ctx.fillStyle = '#FF9800'; ctx.fillText("＋５0", t.x, t.y);
                t.y -= 1.0; t.alpha -= 0.022; t.timer--;
                if (t.timer <= 0) scoreTexts.splice(i, 1);
            }
            ctx.restore();

            // レベルアップテキスト描画 (＋レベル〇〇)
            ctx.save();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = levelUpTexts.length - 1; i >= 0; i--) {
                let lvText = levelUpTexts[i]; ctx.globalAlpha = lvText.alpha;
                ctx.font = `bold ${Math.floor(32 * lvText.scale)}px sans-serif`;
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 4; ctx.strokeText(lvText.text, lvText.x, lvText.y);
                ctx.fillStyle = '#00FFCC'; ctx.fillText(lvText.text, lvText.x, lvText.y);
                if (lvText.scale < 1.3) lvText.scale += 0.04; 
                lvText.y -= 0.3; lvText.alpha -= 0.018; lvText.timer--;
                if (lvText.timer <= 0) levelUpTexts.splice(i, 1);
            }
            ctx.restore();

            // パーティクル処理
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
                particles[i].alpha -= 0.04;
                ctx.save(); ctx.globalAlpha = particles[i].alpha; ctx.fillStyle = particles[i].color;
                ctx.fillRect(particles[i].x, particles[i].y, particles[i].size, particles[i].size); ctx.restore();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            // キャラクターの描画
            if (gameState !== 'GAMEOVER') {
                ctx.save(); ctx.fillStyle = player.color;
                ctx.fillRect(player.x - 4, player.y + 14, 4, 10); ctx.fillRect(player.x + player.width, player.y + 14, 4, 10); 
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillRect(player.x + 2, player.y - 6, 6, 6); ctx.fillRect(player.x + player.width - 8, player.y - 6, 6, 6);
                ctx.fillStyle = '#FFF'; ctx.fillRect(player.x + 10, player.y + 8, 10, 10);
                ctx.fillStyle = '#000'; ctx.fillRect(player.x + 14, player.y + 11, 5, 5);

                ctx.fillStyle = '#D32F2F'; 
                let legOffset = 0;
                if (player.y >= groundY - player.height && gameState === 'PLAYING') {
                    legOffset = Math.sin(animFrame * 0.2) * 5;
                }
                ctx.fillRect(player.x + 3, player.y + player.height, 5, 6 + legOffset);
                ctx.fillRect(player.x + player.width - 8, player.y + player.height, 5, 6 - legOffset);
                ctx.restore();
            }

            // UIパネル描画
            ctx.fillStyle = currentStage >= 15 ? '#FFF' : '#333'; ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`Lv.${currentStage}`, 20, 40);

            let panelX = canvas.width - 160;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillRect(panelX, 15, 140, 45);
            ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.strokeRect(panelX, 15, 140, 45);
            ctx.beginPath(); ctx.moveTo(panelX + 70, 15); ctx.lineTo(panelX + 70, 60); ctx.stroke();

            ctx.fillStyle = '#666'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('SCORE', panelX + 35, 28);
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(score, panelX + 35, 48);

            ctx.fillStyle = '#666'; ctx.font = '10px sans-serif';
            ctx.fillText('BEST', panelX + 105, 28);
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(highScore, panelX + 105, 48);
            ctx.textAlign = 'left';

            requestAnimationFrame(update);
        }

        function drawClouds() {
            let cloudAlpha = Math.max(0.1, 0.85 - (currentStage * 0.02));
            ctx.fillStyle = `rgba(255,255,255,${cloudAlpha})`;
            for (let cloud of clouds) {
                if (gameState === 'PLAYING') cloud.x -= cloud.speed;
                if (cloud.x + cloud.size * 2 < 0) cloud.x = canvas.width + 50;
                ctx.beginPath(); ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.5, cloud.y - cloud.size * 0.3, cloud.size * 0.8, 0, Math.PI * 2); ctx.fill();
            }
        }

        update();
    </script>
</body>
</html>
